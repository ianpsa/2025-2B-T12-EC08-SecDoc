[package]
name = "rust_audio_player"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full", "process", "sync", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
url = "2"
crossbeam-channel = "0.5"  # Faster channels for worker pool
parking_lot = "0.12"       # Faster mutexes
bytes = "1"                # Zero-copy byte handling

[profile.release]
opt-level = 3
lto = "thin"               # Faster compile, still good optimization
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1              # Faster dev builds with some optimization
